name: Validate SCORM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source
        run: npm run validate
      - name: Build package
        run: npm run package
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: spec-driven-agentic-coding-labs-scorm-1.2
          path: dist/spec-driven-agentic-coding-labs-scorm-1.2.zip
          if-no-files-found: error

